name: Fuzz

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Per-target fuzz time (e.g. 5m, 30m, 2h)"
        default: "5m"
        required: true
  schedule:
    # Weekly long-running fuzz on Monday at 03:00 UTC
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  fuzz:
    name: FuzzClientIP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Fuzz clientIP
        run: go test -run='^$' -fuzz=FuzzClientIP -fuzztime=${{ github.event.inputs.duration || '15m' }} ./...

      - name: Upload corpus on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-corpus
          path: testdata/fuzz/
